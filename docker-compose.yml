services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afiliados_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=America/Cuiaba
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - containers

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: afiliados_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      - TZ=America/Cuiaba
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - containers
    depends_on:
      - backend

networks:
  containers:
    name: containers
    external: true
