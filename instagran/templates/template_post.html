<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>Post Shopee - {{PRODUCT_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0F2A4A;
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 10%, rgba(2, 99, 224, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 90% 40%, rgba(255, 110, 46, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 10% 70%, rgba(2, 99, 224, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(255, 110, 46, 0.08) 0%, transparent 50%),
        #F8FAFC;
      z-index: 1;
    }

    .dot-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(15, 42, 74, 0.04) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1350px;
      padding: 56px 64px 60px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Cabeçalho */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-container {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(15, 42, 74, 0.08);
      padding: 8px 22px 8px 12px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(15, 42, 74, 0.05);
    }

    .brand-logo-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #0056B3;
      letter-spacing: -0.3px;
    }

    .brand-name span {
      color: #FF6E2E;
    }

    .promo-tag {
      background: linear-gradient(135deg, #FF6E2E 0%, #EE4D2D 100%);
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 8px 20px rgba(238, 77, 45, 0.25);
    }

    /* Vitrine do Produto no Feed */
    .product-showcase {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin: 10px 0;
    }

    .image-card {
      position: relative;
      width: 580px;
      height: 580px;
      background: #FFFFFF;
      border-radius: 36px;
      padding: 18px;
      box-shadow:
        0 20px 50px rgba(15, 42, 74, 0.09),
        0 0 0 1px rgba(15, 42, 74, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 26px;
    }

    .trust-pill {
      position: absolute;
      bottom: 20px;
      background: #FFFFFF;
      border: 1px solid rgba(15, 42, 74, 0.10);
      color: #0F2A4A;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(15, 42, 74, 0.08);
    }

    .trust-pill svg {
      width: 20px;
      height: 20px;
      fill: #FF6E2E;
    }

    /* Informações e Preço */
    .details {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .product-title {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 800;
      line-height: 1.25;
      color: #0F2A4A;
      max-width: 960px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      letter-spacing: -0.4px;
    }

    .price-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 36px;
      border-radius: 22px;
      border: 1px solid rgba(15, 42, 74, 0.07);
      box-shadow: 0 10px 28px rgba(15, 42, 74, 0.05);
    }

    .price-label {
      font-size: 18px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .price-wrapper {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
    }

    .price-currency {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #0056B3;
    }

    .price-value {
      font-family: 'Outfit', sans-serif;
      font-size: 74px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #FF5500;
      line-height: 1;
    }

    /* Chamada para Ação para o Grupo da Bio */
    .cta-container {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid rgba(255, 110, 46, 0.25);
      border-radius: 30px;
      padding: 24px 32px;
      box-shadow: 0 16px 40px rgba(15, 42, 74, 0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 960px;
    }

    .cta-button {
      width: 100%;
      background: linear-gradient(135deg, #FF6E2E 0%, #EE4D2D 60%, #D83B1C 100%);
      color: #FFFFFF;
      padding: 22px 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(238, 77, 45, 0.30);
    }

    .cta-button svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }

    .cta-instructions {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      color: #334155;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .cta-instructions strong {
      color: #0056B3;
    }
  </style>
</head>

<body>
  <div class="background"></div>
  <div class="dot-overlay"></div>

  <div class="container">
    <!-- Topo -->
    <header class="header">
      <div class="brand-container">
        <img src="dicacerta.png" alt="Dica Certa Shop" class="brand-logo-img">
        <div class="brand-name">Dica Certa <span>Shopee</span></div>
      </div>
      <div class="promo-tag">ACHADINHO DO DIA</div>
    </header>

    <!-- Card de Imagem -->
    <main class="product-showcase">
      <div class="image-card">
        <img src="{{PRODUCT_IMAGE}}" alt="{{PRODUCT_TITLE}}">
        <div class="trust-pill">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" />
          </svg>
          Produto Original Shopee
        </div>
      </div>
    </main>

    <!-- Detalhes e Preço -->
    <section class="details">
      <h1 class="product-title">{{PRODUCT_TITLE}}</h1>
      <div class="price-box">
        <span class="price-label">Valor Promocional</span>
        <div class="price-wrapper">
          <span class="price-currency">R$</span>
          <span class="price-value">{{PRODUCT_PRICE}}</span>
        </div>
      </div>
    </section>

    <!-- Chamada para Ação para o Grupo da Bio -->
    <footer class="cta-container">
      <div class="cta-button">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.34 5L2 22l5.23-1.31C8.63 21.49 10.27 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.57 0-3.05-.44-4.32-1.21l-.31-.18-3.19.8 1.05-3.08-.2-.32C4.33 14.77 3.8 13.43 3.8 12c0-4.52 3.68-8.2 8.2-8.2 4.52 0 8.2 3.68 8.2 8.2 0 4.52-3.68 8.2-8.2 8.2z" />
        </svg>
        LINK NO GRUPO VIP DA BIO
      </div>
    </footer>
  </div>
</body>

</html>
